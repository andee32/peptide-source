# Local Postgres for AT Lab dev + tests. Optional — production and hosted dev
# use Neon (see .env.example). Bring it up with `docker compose up -d`, then point
# DATABASE_URL at it:
#   DATABASE_URL=postgres://atlab:atlab@localhost:5432/atlab
# The init script also creates an `atlab_test` database for the integration suite.
services:
  postgres:
    image: postgres:16-alpine
    container_name: atlab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: atlab
      POSTGRES_PASSWORD: atlab
      POSTGRES_DB: atlab
    ports:
      - "5432:5432"
    volumes:
      - atlab_pgdata:/var/lib/postgresql/data
      - ./scripts/db/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlab -d atlab"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  atlab_pgdata:
