          format: date-time
        channel:
          type: string
          enum: [retail, wholesale]
        status:
          $ref: "#/components/schemas/OrderStatus"
        totalCents:
          type: integer
        shippingName:
          type: string
        shippingEmail:
          type: string
        accountId:
          type: string
