          items:
            $ref: "#/components/schemas/OrderLineItem"
        subtotalCents:
          type: integer
        discountCents:
          type: integer
        totalCents:
          type: integer
        paymentMethod:
          $ref: "#/components/schemas/PaymentMethod"
        channel:
          type: string
          enum: [retail, wholesale]
        accountId:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/OrderStatus"
        shippingName:
          type: string
        shippingEmail:
          type: string
        shippingAddress1:
          type: string
        shippingAddress2:
          type: string
          nullable: true
        shippingCity:
          type: string
        shippingState:
          type: string
        shippingZip:
          type: string
        shippingCountry:
          type: string
        trackingNumber:
          type: string
          nullable: true
        carrier:
