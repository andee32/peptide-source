openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: products
    description: Product catalog operations
  - name: batches
    description: Batch and COA verification operations
  - name: accounts
    description: B2B wholesale account application and approval operations
  - name: retail
    description: Public B2C retail catalog operations (single-vial variants)
  - name: settings
    description: Global store settings (public read, admin write)
  - name: adminUsers
    description: Back-office admin user management (admin only)
  - name: auth
    description: B2C retail customer accounts, sessions, order history and reorder
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List all products
      description: Returns all published products
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: featured
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get product by ID
      description: Returns a single product with its variants
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /retail/products:
    get:
      operationId: listRetailProducts
      tags: [retail]
      summary: List retail products
      description: >-
        Returns published, non-blocked products for the public B2C retail
        storefront, each with only its single-vial variants and retail pricing.
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of retail products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RetailProduct"

  /retail/products/{slug}:
    get:
      operationId: getRetailProduct
      tags: [retail]
      summary: Get retail product by slug
      description: Returns a single retail product with its single-vial variants.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Retail product detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetailProductDetail"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /batches:
    get:
      operationId: listBatches
      tags: [batches]
      summary: List batches
      description: Returns batches, optionally filtered by product ID
      parameters:
        - name: productId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of batches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BatchSummary"

  /batches/{id}/qr:
    get:
      operationId: getBatchQr
      tags: [batches]
      summary: Get batch QR code image
      description: Returns a PNG QR code that encodes the public batch verification URL (includes ?source=qr for analytics attribution)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: QR code PNG image
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          description: Batch not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /batches/{id}:
    get:
      operationId: getBatch
      tags: [batches]
      summary: Get batch by ID
      description: Returns a batch with full COA test results
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Batch detail with COA results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchDetail"
        "404":
          description: Batch not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /orders:
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create a new order
      description: Creates an order with optional 10% Transparency Discount when crypto payment is selected
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderSummary"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Wholesale account not approved or token mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Order rule violation — wholesale kit-only/MOQ, or a line item whose SKU is compliance-blocked
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/MoqError"
                  - $ref: "#/components/schemas/SkuNotAvailable"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get order by ID
      description: Returns order with current status and payment record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order detail with payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /orders/{id}/crypto-invoice:
    post:
      operationId: createCryptoInvoice
      tags: [orders]
      summary: Create or retrieve a crypto payment invoice
      description: Creates a BTCPayServer invoice for the order and returns payment address, QR data, and expiry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Invoice created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CryptoInvoice"
        "200":
          description: Existing pending invoice returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CryptoInvoice"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /orders/{id}/payment-qr:
    get:
      operationId: getOrderPaymentQr
      tags: [orders]
      summary: Get payment QR code PNG
      description: Returns a PNG QR code encoding the crypto payment URI (bitcoin:... or ethereum:...)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: QR code PNG
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          description: Payment record not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /orders/{id}/ach-instructions:
    post:
      operationId: createAchInstructions
      tags: [orders]
      summary: Get ACH / wire payment instructions for an order
      description: Returns bank wire / ACH instructions and a unique reference code, and creates (or returns an existing) pending payment_records row with method=ach. Only valid for orders whose paymentMethod is ach or wire.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Instructions created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AchInstructions"
        "200":
          description: Existing pending instructions returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AchInstructions"
        "400":
          description: Order does not use the ACH/wire rail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/orders/{id}/confirm-ach:
    post:
      operationId: adminConfirmAch
      tags: [orders]
      summary: Admin — confirm an ACH / wire payment as received
      description: Settles the order's pending ACH payment_records row (status=confirmed) and sets the order status to confirmed. Requires x-admin-key header.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmAchRequest"
      responses:
        "200":
          description: Payment confirmed and order settled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmAchResponse"
        "401":
          description: Admin key required
        "404":
          description: Order or pending ACH payment record not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get public store settings
      description: Public endpoint returning global storefront settings. Returns defaults (showVialImages=true) if the settings row is absent.
      responses:
        "200":
          description: Store settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreSettings"

  /admin/settings:
    patch:
      operationId: adminPatchSettings
      tags: [settings]
      summary: Update store settings (admin)
      description: Admin-only. Updates global storefront settings; upserts the single 'default' row if absent. Requires x-admin-key header.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchStoreSettingsRequest"
      responses:
        "200":
          description: Updated store settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreSettings"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Admin key required

  /reviewer-submissions:
    post:
      operationId: createReviewerSubmission
      tags: [reviewers]
      summary: Submit a community reviewer result
      description: Public endpoint — creates a reviewer submission in pending state. Validates Janoshik Task ID format.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewerSubmissionRequest"
      responses:
        "201":
          description: Submission created (pending review)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewerSubmissionCreated"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    get:
      operationId: listReviewerSubmissions
      tags: [reviewers]
      summary: List approved reviewer submissions
      description: Public endpoint returns approved submissions only. Admin (x-admin-key header) sees all statuses.
      responses:
        "200":
          description: List of reviewer submissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReviewerSubmission"

  /reviewer-submissions/stats:
    get:
      operationId: getReviewerSubmissionStats
      tags: [reviewers]
      summary: Get reviewer submission statistics
      description: Returns the count of approved community verifications
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewerSubmissionStats"

  /reviewer-submissions/{id}:
    patch:
      operationId: patchReviewerSubmission
      tags: [reviewers]
      summary: Approve or reject a reviewer submission (admin)
      description: Admin-only endpoint to approve or reject a pending submission
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchReviewerSubmissionRequest"
      responses:
        "200":
          description: Updated submission status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewerSubmissionPatched"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Admin key required
        "404":
          description: Submission not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /subscription-plans:
    get:
      operationId: listSubscriptionPlans
      tags: [subscriptions]
      summary: List all subscription plans
      description: Returns all research kit subscription plans, ordered by featured then interval
      responses:
        "200":
          description: List of subscription plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubscriptionPlan"

  /subscription-plans/{slug}:
    get:
      operationId: getSubscriptionPlan
      tags: [subscriptions]
      summary: Get a subscription plan by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Subscription plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPlan"
        "404":
          description: Plan not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /subscriptions:
    post:
      operationId: createSubscription
      tags: [subscriptions]
      summary: Create a new subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubscriptionRequest"
      responses:
        "201":
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionCreated"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Plan not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    get:
      operationId: listSubscriptions
      tags: [subscriptions]
      summary: List subscriptions by email or all (admin)
      description: |
        With x-admin-key: returns all subscriptions including customerEmail and shippingAddress.
        Without x-admin-key: requires `email` query param (validated as email); returns subscriptions for that email WITHOUT customerEmail, shippingAddress, or accessToken fields. This is a safe read-only listing.
      parameters:
        - name: email
          in: query
          required: false
          schema:
            type: string
            format: email
          description: Required for non-admin. Returns subscriptions for this customer (no sensitive fields exposed).
      responses:
        "200":
          description: List of subscriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubscriptionDetail"
        "400":
          description: Missing or invalid email (non-admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /subscriptions/{id}/skip:
    patch:
      operationId: skipSubscription
      tags: [subscriptions]
      summary: Skip next shipment (defer by one interval)
      description: Requires either x-admin-key header or the subscription's accessToken in the request body.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: Subscription access token returned at creation (required for non-admin)
      responses:
        "200":
          description: Next billing date deferred
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionSkipped"
        "403":
          description: Invalid or missing access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Subscription not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /subscriptions/{id}:
    get:
      operationId: getSubscription
      tags: [subscriptions]
      summary: Get a single subscription by ID
      description: Requires either x-admin-key header or the subscription's accessToken as a query parameter. Does NOT return the accessToken in the response body.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: token
          in: query
          required: false
          schema:
            type: string
          description: Subscription access token (required for non-admin)
      responses:
        "200":
          description: Subscription detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionDetail"
        "403":
          description: Invalid or missing access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Subscription not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: cancelSubscription
      tags: [subscriptions]
      summary: Cancel a subscription
      description: Requires either x-admin-key header or the subscription's accessToken as a query parameter.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: token
          in: query
          required: false
          schema:
            type: string
          description: Subscription access token (required for non-admin)
      responses:
        "200":
          description: Subscription cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionCancelled"
        "403":
          description: Invalid or missing access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Subscription not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/subscriptions:
    get:
      operationId: adminListSubscriptions
      tags: [subscriptions]
      summary: Admin — list all subscriptions with stats
      description: Returns all subscriptions with renewal counts. Requires x-admin-key header.
      responses:
        "200":
          description: Admin subscription overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSubscriptionsOverview"
        "401":
          description: Admin key required

  /admin/subscriptions/dispatch-reminders:
    post:
      operationId: dispatchSubscriptionReminders
      tags: [subscriptions]
      summary: Admin — dispatch 3-day renewal reminder emails
      description: Finds all active subscriptions with nextBillingDate in [now+3d, now+4d] and sends reminder emails. Also runs automatically on server start and every 24 hours.
      responses:
        "200":
          description: Dispatch result
          content:
            application/json:
              schema:
                type: object
                properties:
                  checked:
                    type: integer
                    description: Number of subscriptions matched the 3-day window
                  sent:
                    type: integer
                    description: Number of emails successfully sent
                  failed:
                    type: integer
                    description: Number of emails that failed to send
                required:
                  - checked
                  - sent
                  - failed
        "401":
          description: Admin key required

  /admin/subscriptions/{id}/status:
    patch:
      operationId: adminPatchSubscriptionStatus
      tags: [subscriptions]
      summary: Admin — override subscription status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [active, paused, cancelled]
              required:
                - status
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionCancelled"
        "401":
          description: Admin key required
        "404":
          description: Subscription not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /accounts/apply:
    post:
      operationId: applyForAccount
      tags: [accounts]
      summary: Apply for a B2B wholesale account
      description: Public endpoint — creates a customer account in pending status and returns an access token used to check application status later.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyAccountRequest"
      responses:
        "201":
          description: Application received (pending review)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountCreated"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: An account with that email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /accounts/{id}:
    get:
      operationId: getAccount
      tags: [accounts]
      summary: Get a wholesale account by ID
      description: Requires either x-admin-key header or the account's accessToken (header x-account-token or query token). Returns status and assigned price tier. Does NOT return the accessToken.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: token
          in: query
          required: false
          schema:
            type: string
          description: Account access token (required for non-admin)
      responses:
        "200":
          description: Account detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "403":
          description: Invalid or missing access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/accounts:
    get:
      operationId: adminListAccounts
      tags: [accounts]
      summary: Admin — list wholesale account applications
      description: Returns wholesale accounts, optionally filtered by status. Requires x-admin-key header.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AccountStatus"
      responses:
        "200":
          description: List of accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
        "401":
          description: Admin key required

  /admin/accounts/{id}:
    patch:
      operationId: adminPatchAccount
      tags: [accounts]
      summary: Admin — approve, reject, suspend, or assign a tier to an account
      description: Sets status and/or price tier and KYB notes. Stamps approvedAt/approvedBy when approved. Requires x-admin-key header.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchAccountRequest"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Admin key required
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/price-tiers:
    get:
      operationId: adminListPriceTiers
      tags: [accounts]
      summary: Admin — list price tiers
      description: Returns all wholesale price tiers. Requires x-admin-key header.
      responses:
        "200":
          description: List of price tiers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PriceTier"
        "401":
          description: Admin key required

  /admin/stats:
    get:
      operationId: adminGetStats
      tags: [admin]
      summary: Admin — dashboard stats
      description: Server-derived operational counters and confirmed revenue. Requires x-admin-key header.
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"
        "401":
          description: Admin key required

  /admin/orders:
    get:
      operationId: adminListOrders
      tags: [admin]
      summary: Admin — list orders
      description: Lists orders newest-first, optionally filtered by channel and/or status. Requires x-admin-key header.
      parameters:
        - name: channel
          in: query
          required: false
          schema:
            type: string
            enum: [retail, wholesale]
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OrderStatus"
      responses:
        "200":
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminOrderSummary"
        "400":
          description: Invalid filter value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Admin key required

  /admin/orders/{id}:
    get:
      operationId: adminGetOrder
      tags: [admin]
      summary: Admin — full order detail
      description: Returns the order plus its line items, payment records, RUO attestations, and linked wholesale account (if any). Requires x-admin-key header.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrderDetail"
        "401":
          description: Admin key required
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: adminPatchOrder
      tags: [admin]
      summary: Admin — update order status and/or shipment tracking
      description: Updates status (blocked from leaving a terminal status) and/or trackingNumber + carrier. Requires x-admin-key header.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchOrderRequest"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrderDetail"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Admin key required
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Order is in a terminal status and cannot be changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/orders/{id}/refund:
    post:
      operationId: adminRefundOrder
      tags: [admin]
      summary: Admin — mark an order refunded
      description: Sets order status to refunded. This is the record of record only; the actual crypto refund is performed off-platform per CRYPTO_REFUND_GUIDE. Requires x-admin-key header.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Refunded order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrderDetail"
        "401":
          description: Admin key required
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Order is already refunded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/catalog:
    get:
      operationId: adminGetCatalog
      tags: [admin]
      summary: Admin — full catalog including blocked products
      description: Returns all products (including complianceStatus=blocked) with their variants. Requires x-admin-key header.
      responses:
        "200":
          description: Catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogProduct"
        "401":
          description: Admin key required

  /admin/products/{id}:
    patch:
      operationId: adminPatchProduct
      tags: [admin]
      summary: Admin — edit product merchandising / compliance controls
      description: Updates featured, complianceStatus, and/or sourcingPath. complianceStatus is a dormant control — flipping it does not auto-block anything. Requires x-admin-key header.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchProductRequest"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Admin key required
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/variants/{id}:
    patch:
      operationId: adminPatchVariant
      tags: [admin]
      summary: Admin — edit variant price / stock
      description: Updates priceCents and/or inStock. Requires x-admin-key header.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchVariantRequest"
      responses:
        "200":
          description: Updated variant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductVariant"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Admin key required
        "404":
          description: Variant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /webhooks/btcpay:
    post:
      operationId: handleBtcpayWebhook
      tags: [webhooks]
      summary: BTCPayServer webhook receiver
      description: Receives InvoiceSettled, InvoiceExpired, and InvoiceInvalid events from BTCPayServer and updates order status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BtcpayWebhookEvent"
      responses:
        "200":
          description: Event received
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
        "401":
          description: Invalid webhook signature

  /admin/users:
    get:
      operationId: adminListAdminUsers
      tags: [adminUsers]
      summary: Admin — list back-office admin users
      description: Returns all admin users. Never returns passwordHash. Requires x-admin-key header.
      responses:
        "200":
          description: List of admin users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "401":
          description: Admin key required
    post:
      operationId: adminCreateAdminUser
      tags: [adminUsers]
      summary: Admin — create an admin user
      description: Hashes the supplied password (PBKDF2) and stores it. Requires x-admin-key header.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminUserRequest"
      responses:
        "201":
          description: Admin user created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Admin key required
        "409":
          description: An admin user with that email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/users/{id}:
    patch:
      operationId: adminPatchAdminUser
      tags: [adminUsers]
      summary: Admin — rename, deactivate, or reactivate an admin user
      description: Deactivating the last active admin user is rejected. Requires x-admin-key header.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchAdminUserRequest"
      responses:
        "200":
          description: Updated admin user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Admin key required
        "404":
          description: Admin user not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Cannot deactivate the last active admin user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /admin/users/{id}/password:
    post:
      operationId: adminSetAdminUserPassword
      tags: [adminUsers]
      summary: Admin — set or reset an admin user's password
      description: Supply currentPassword for a self-service change; omit it for an admin-performed reset. Requires x-admin-key header.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetAdminPasswordRequest"
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Admin key required, or currentPassword incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Admin user not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/register:
    post:
      operationId: registerCustomer
      tags: [auth]
      summary: Register a B2C retail account
      description: Creates a retail shopper account and returns a bearer session token. Retail accounts are optional — guest checkout remains open.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterCustomerRequest"
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSession"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: An account with that email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/login:
    post:
      operationId: loginCustomer
      tags: [auth]
      summary: Sign in to a B2C retail account
      description: Returns a bearer session token. Send it as an Authorization bearer header on subsequent /auth calls and at checkout.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginCustomerRequest"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSession"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/logout:
    post:
      operationId: logoutCustomer
      tags: [auth]
      summary: Sign out (revokes the bearer session)
      description: Deletes the session named by the Authorization bearer token. Always succeeds.
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /auth/me:
    get:
      operationId: getCurrentCustomer
      tags: [auth]
      summary: Current signed-in retail customer
      description: Requires an Authorization bearer session token.
      responses:
        "200":
          description: Current customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerUser"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/orders:
    get:
      operationId: listCustomerOrders
      tags: [auth]
      summary: This customer's retail order history
      description: Returns retail orders stamped with this customer's id at checkout plus any guest order placed to the same shipping email. Requires an Authorization bearer session token.
      responses:
        "200":
          description: Order history, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomerOrderSummary"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/reorder/{orderId}:
    post:
      operationId: reorderFromOrder
      tags: [auth]
      summary: Rebuild a cart payload from a past order
      description: Prices are re-derived from the current catalog; out-of-stock or removed variants are returned in `unavailable`. Requires an Authorization bearer session token.
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reorder cart payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReorderPayload"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Order not found for this customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

components:
  schemas:
    ReviewerSubmission:
      type: object
      properties:
        id:
          type: integer
        reviewerHandle:
          type: string
        platform:
          type: string
          enum: [reddit, discord, other]
        janoshikTaskId:
          type: string
        productId:
          type: integer
        productName:
          type: string
        purityPercent:
          type: number
          nullable: true
        notes:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, approved, rejected]
        submittedAt:
          type: string
          format: date-time
        reviewedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - reviewerHandle
        - platform
        - janoshikTaskId
        - productId
        - productName
        - status
        - submittedAt

    CreateReviewerSubmissionRequest:
      type: object
      properties:
        reviewerHandle:
          type: string
          minLength: 2
          maxLength: 100
        platform:
          type: string
          enum: [reddit, discord, other]
        janoshikTaskId:
          type: string
          description: "Janoshik Task ID — letters followed by digits (e.g. J12345678)"
        productId:
          type: integer
        purityPercent:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
        notes:
          type: string
          nullable: true
      required:
        - reviewerHandle
        - janoshikTaskId
        - productId

    ReviewerSubmissionCreated:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [pending]
        submittedAt:
          type: string
          format: date-time
      required:
        - id
        - status
        - submittedAt

    ReviewerSubmissionStats:
      type: object
      properties:
        approvedCount:
          type: integer
      required:
        - approvedCount

    PatchReviewerSubmissionRequest:
      type: object
      properties:
        status:
          type: string
          enum: [approved, rejected]
        adminNotes:
          type: string
          nullable: true
      required:
        - status

    ReviewerSubmissionPatched:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [pending, approved, rejected]
        reviewedAt:
          type: string
          format: date-time
      required:
        - id
        - status
        - reviewedAt

    SubscriptionPlan:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        intervalDays:
          type: integer
        productBundle:
          type: array
          items:
            type: object
            additionalProperties: true
        pricePerIntervalCents:
          type: integer
        featured:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - slug
        - description
        - intervalDays
        - productBundle
        - pricePerIntervalCents
        - featured

    CreateSubscriptionRequest:
      type: object
      properties:
        customerEmail:
          type: string
          format: email
        customerName:
          type: string
        planId:
          type: integer
        intervalDays:
          type: integer
          enum: [30, 60, 90]
        shippingAddress:
          type: object
          additionalProperties: true
        notes:
          type: string
          nullable: true
      required:
        - customerEmail
        - planId
        - intervalDays

    SubscriptionCreated:
      type: object
      description: Returned after subscription creation. The accessToken is a one-time credential; store it securely (e.g., localStorage) to manage this subscription later.
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [active]
        planName:
          type: string
        intervalDays:
          type: integer
        nextBillingDate:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        accessToken:
          type: string
          description: Opaque token required to authenticate skip/cancel/get operations for this subscription. Never transmitted back by the API after this response.
      required:
        - id
        - status
        - planName
        - intervalDays
        - nextBillingDate
        - createdAt
        - accessToken

    SubscriptionDetail:
      type: object
      properties:
        id:
          type: integer
        customerEmail:
          type: string
        customerName:
          type: string
        status:
          type: string
          enum: [active, paused, cancelled]
        intervalDays:
          type: integer
        nextBillingDate:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        planName:
          type: string
        planSlug:
          type: string
        planDescription:
          type: string
        planBundle:
          type: array
          items:
            type: object
            additionalProperties: true
        planPriceCents:
          type: integer
      required:
        - id
        - customerEmail
        - status
        - intervalDays
        - nextBillingDate
        - createdAt
        - planName
        - planSlug
        - planPriceCents

    SubscriptionSkipped:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
        nextBillingDate:
          type: string
          format: date-time
      required:
        - id
        - status
        - nextBillingDate

    SubscriptionCancelled:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
      required:
        - id
        - status

    AdminSubscriptionsOverview:
      type: object
      properties:
        total:
          type: integer
        active:
          type: integer
        paused:
          type: integer
        cancelled:
          type: integer
        renewingIn7Days:
          type: integer
        renewingIn30Days:
          type: integer
        subscriptions:
          type: array
          items:
            $ref: "#/components/schemas/SubscriptionDetail"
      required:
        - total
        - active
        - paused
        - cancelled
        - renewingIn7Days
        - renewingIn30Days
        - subscriptions

    BtcpayWebhookEvent:
      type: object
      description: BTCPayServer webhook event payload (InvoiceSettled, InvoiceExpired, InvoiceInvalid, etc.)
      properties:
        type:
          type: string
          description: Event type (e.g. InvoiceSettled, InvoiceExpired, InvoiceInvalid)
        invoiceId:
          type: string
          nullable: true
      additionalProperties: true

    AccountStatus:
      type: string
      enum: [pending, approved, rejected, suspended]

    PriceTier:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        isDefault:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - slug
        - isDefault
        - createdAt

    ApplyAccountRequest:
      type: object
      properties:
        businessName:
          type: string
          minLength: 1
          maxLength: 200
        contactName:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
        phone:
          type: string
          minLength: 1
          maxLength: 50
        businessType:
          type: string
          enum: [research_lab, clinic, reseller, distributor, other]
        taxId:
          type: string
          nullable: true
        resaleCertUrl:
          type: string
          nullable: true
      required:
        - businessName
        - contactName
        - email
        - phone
        - businessType

    AccountCreated:
      type: object
      description: Returned after applying. The accessToken is a one-time credential; store it to check application status later.
      properties:
        id:
          type: string
        status:
          type: string
          enum: [pending]
        accessToken:
          type: string
          description: Opaque token required to fetch this account's status. Never returned again after this response.
      required:
        - id
        - status
        - accessToken

    Account:
      type: object
      properties:
        id:
          type: string
        businessName:
          type: string
        contactName:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true
        businessType:
          type: string
          nullable: true
        taxId:
          type: string
          nullable: true
        resaleCertUrl:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/AccountStatus"
        priceTierId:
          type: integer
          nullable: true
        priceTier:
          $ref: "#/components/schemas/PriceTier"
          nullable: true
        kybNotes:
          type: string
          nullable: true
        approvedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - businessName
        - contactName
        - email
        - status
        - createdAt

    PatchAccountRequest:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/AccountStatus"
        priceTierId:
          type: integer
          nullable: true
        kybNotes:
          type: string
          nullable: true

    MoqError:
      type: object
      description: Wholesale order rule violation (422). code distinguishes the specific rule that failed.
      properties:
        error:
          type: string
        message:
          type: string
        code:
          type: string
          enum: [MOQ_NOT_MET, WHOLESALE_KIT_REQUIRED]
      required:
        - error
        - message
        - code

    SkuNotAvailable:
      type: object
      description: A line item references a product whose complianceStatus is blocked (422). The SKU is unlisted and unsellable.
      properties:
        error:
          type: string
        message:
          type: string
        code:
          type: string
          enum: [SKU_NOT_AVAILABLE]
      required:
        - error
        - message
        - code

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ApiError:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message

    ComplianceStatus:
      type: string
      description: Per-SKU compliance gate. blocked = unlisted + unsellable; restricted = listed and orderable (reserved for later); cleared = normal.
      enum: [blocked, restricted, cleared]

    ProductVariant:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        concentration:
          type: string
        sizeml:
          type: number
        priceCents:
          type: integer
        sku:
          type: string
        inStock:
          type: boolean
      required:
        - id
        - name
        - concentration
        - sizeml
        - priceCents
        - sku
        - inStock

    Product:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        category:
          type: string
        complianceStatus:
          $ref: "#/components/schemas/ComplianceStatus"
        shortDescription:
          type: string
        featured:
          type: boolean
        imageUrl:
          type: string
          nullable: true
        startingPriceCents:
          type: integer
        latestBatchId:
          type: string
          nullable: true
        latestBatchStatus:
          type: string
          nullable: true
        latestBatchPurity:
          type: number
          nullable: true
        latestBatchIsDemo:
          type: boolean
          nullable: true
          description: >-
            Demo status of the batch behind latestBatchPurity. True/null =
            treat the purity as fabricated sample data, not a real COA.
      required:
        - id
        - name
        - slug
        - category
        - complianceStatus
        - shortDescription
        - featured
        - startingPriceCents

    ProductDetail:
      allOf:
        - $ref: "#/components/schemas/Product"
        - type: object
          properties:
            longDescription:
              type: string
            researchUses:
              type: array
              items:
                type: string
            variants:
              type: array
              items:
                $ref: "#/components/schemas/ProductVariant"
            latestBatch:
              $ref: "#/components/schemas/BatchDetail"
              nullable: true
          required:
            - longDescription
            - researchUses
            - variants

    CoaHeavyMetal:
      type: object
      properties:
        element:
          type: string
        resultPpm:
          type: number
        limitPpm:
          type: number
        pass:
          type: boolean
      required:
        - element
        - resultPpm
        - limitPpm
        - pass

    CoaResult:
      type: object
      properties:
        id:
          type: string
        testType:
          type: string
          enum: [purity, endotoxin, sterility, heavyMetals]
        purityPercent:
          type: number
          nullable: true
        endotoxinEuPerMl:
          type: number
          nullable: true
        sterilityPass:
          type: boolean
          nullable: true
        heavyMetals:
          type: array
          items:
            $ref: "#/components/schemas/CoaHeavyMetal"
          nullable: true
        labName:
          type: string
        testedAt:
          type: string
          format: date-time
        janoshikTaskId:
          type: string
          nullable: true
      required:
        - id
        - testType
        - labName
        - testedAt

    BatchSummary:
      type: object
      properties:
        id:
          type: string
        productId:
          type: integer
        productName:
          type: string
        productionDate:
          type: string
          format: date-time
        status:
          type: string
          enum: [pending, released, quarantined]
        isDemo:
          type: boolean
          description: >-
            True when this batch is fabricated demonstration/sample data, not a
            real third-party certificate of analysis. Fail-safe: any batch not
            explicitly marked real is demo.
        purityPercent:
          type: number
          nullable: true
      required:
        - id
        - productId
        - productName
        - productionDate
        - status
        - isDemo

    BatchDetail:
      allOf:
        - $ref: "#/components/schemas/BatchSummary"
        - type: object
          properties:
            coaResults:
              type: array
              items:
                $ref: "#/components/schemas/CoaResult"
            notes:
              type: string
              nullable: true
          required:
            - coaResults

    OrderLineItem:
      type: object
      properties:
        variantId:
          type: integer
        productName:
          type: string
        variantName:
          type: string
        quantity:
          type: integer
        unitPriceCents:
          type: integer
      required:
        - variantId
        - productName
        - variantName
        - quantity
        - unitPriceCents

    CreateOrderLineItem:
      type: object
      description: Line item for order creation — server resolves price and names from variantId
      properties:
        variantId:
          type: integer
        quantity:
          type: integer
          minimum: 1
          maximum: 100
      required:
        - variantId
        - quantity

    CreateOrderRequest:
      type: object
      properties:
        accountId:
          type: string
          nullable: true
          description: B2B wholesale account ID. When present with a valid token, the order is placed on the wholesale channel with tier-resolved pricing and kit/MOQ enforcement.
        token:
          type: string
          nullable: true
          description: Wholesale account access token. Required when accountId is provided.
        sessionId:
          type: string
          nullable: true
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/CreateOrderLineItem"
          minItems: 1
        paymentMethod:
          $ref: "#/components/schemas/PaymentMethod"
        ruoAffirmed:
          type: boolean
          description: Must be true. Server-side RUO (Research Use Only) affirmation; the order is rejected (400) when not exactly true.
        signerName:
          type: string
          minLength: 1
          maxLength: 200
          description: Name of the person affirming the RUO attestation. Snapshotted into the order_attestations record.
        shippingName:
          type: string
        shippingEmail:
          type: string
          format: email
        shippingAddress1:
          type: string
        shippingAddress2:
          type: string
          nullable: true
        shippingCity:
          type: string
        shippingState:
          type: string
        shippingZip:
          type: string
        shippingCountry:
          type: string
          default: US
      required:
        - lineItems
        - paymentMethod
        - ruoAffirmed
        - signerName
        - shippingName
        - shippingEmail
        - shippingAddress1
        - shippingCity
        - shippingState
        - shippingZip

    PaymentMethod:
      type: string
      description: Payment rail. Crypto-first (BTCPay) + ACH/wire only. Card is not supported.
      enum: [crypto_btc, crypto_usdc, ach, wire]

    OrderSummary:
      type: object
      properties:
        id:
          type: string
        subtotalCents:
          type: integer
        discountCents:
          type: integer
        totalCents:
          type: integer
        paymentMethod:
          $ref: "#/components/schemas/PaymentMethod"
        status:
          type: string
          enum: [pending, awaiting_payment, confirmed, failed, expired, refunded]
        channel:
          type: string
          enum: [retail, wholesale]
      required:
        - id
        - subtotalCents
        - discountCents
        - totalCents
        - paymentMethod
        - status
        - channel

    PaymentRecord:
      type: object
      properties:
        id:
          type: string
        orderId:
          type: string
        btcpayInvoiceId:
          type: string
          nullable: true
        currency:
          type: string
        amount:
          type: string
        amountCents:
          type: integer
        paymentAddress:
          type: string
          nullable: true
        paymentUrl:
          type: string
          nullable: true
        txHash:
          type: string
          nullable: true
        confirmedAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [pending, confirmed, expired, failed]
      required:
        - id
        - orderId
        - currency
        - amount
        - amountCents
        - expiresAt
        - status

    OrderDetail:
      allOf:
        - $ref: "#/components/schemas/OrderSummary"
        - type: object
          properties:
            sessionId:
              type: string
            lineItems:
              type: array
              items:
                $ref: "#/components/schemas/OrderLineItem"
            shippingName:
              type: string
            shippingEmail:
              type: string
            shippingAddress1:
              type: string
            shippingCity:
              type: string
            shippingState:
              type: string
            shippingZip:
              type: string
            shippingCountry:
              type: string
            payment:
              $ref: "#/components/schemas/PaymentRecord"
              nullable: true
            createdAt:
              type: string
              format: date-time
          required:
            - lineItems
            - shippingName
            - shippingEmail
            - shippingAddress1
            - shippingCity
            - shippingState
            - shippingZip
            - shippingCountry
            - createdAt

    CryptoInvoice:
      type: object
      properties:
        paymentRecordId:
          type: string
        btcpayInvoiceId:
          type: string
          nullable: true
        currency:
          type: string
          enum: [BTC, USDC]
        amount:
          type: string
          description: Crypto amount as string (e.g. "0.00123456" for BTC)
        amountCents:
          type: integer
          description: USD equivalent in cents
        paymentAddress:
          type: string
          nullable: true
        paymentUrl:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
        qrPaymentUri:
          type: string
          description: BIP21 / EIP-681 URI for QR code encoding
      required:
        - paymentRecordId
        - currency
        - amount
        - amountCents
        - expiresAt
        - qrPaymentUri

    AchInstructions:
      type: object
      description: Bank wire / ACH payment instructions for an order, plus a unique reference code the customer must include in the transfer memo.
      properties:
        paymentRecordId:
          type: string
        orderId:
          type: string
        referenceCode:
          type: string
          description: Unique memo/reference code the customer must include with the transfer so it can be reconciled.
        amountCents:
          type: integer
        amount:
          type: string
          description: USD amount as a decimal string (e.g. "375.00").
        currency:
          type: string
          enum: [USD]
        status:
          type: string
          enum: [pending]
        expiresAt:
          type: string
          format: date-time
        instructions:
          $ref: "#/components/schemas/BankInstructions"
      required:
        - paymentRecordId
        - orderId
        - referenceCode
        - amountCents
        - amount
        - currency
        - status
        - expiresAt
        - instructions

    BankInstructions:
      type: object
      description: Beneficiary bank details for ACH / wire transfers. PLACEHOLDER values until real banking is provisioned.
      properties:
        beneficiaryName:
          type: string
        bankName:
          type: string
        routingNumber:
          type: string
        accountNumber:
          type: string
        accountType:
          type: string
        memo:
          type: string
          description: The referenceCode, restated for the transfer memo field.
      required:
        - beneficiaryName
        - bankName
        - routingNumber
        - accountNumber
        - accountType
        - memo

    ConfirmAchRequest:
      type: object
      properties:
        bankLast4:
          type: string
          nullable: true
          description: Optional last 4 digits of the originating account, recorded on the payment record.
      additionalProperties: false

