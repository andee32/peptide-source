      type: object
      properties:
        orderId:
          type: string
        paymentRecordId:
          type: string
        orderStatus:
          type: string
          enum: [confirmed]
        paymentStatus:
          type: string
          enum: [confirmed]
      required:
        - orderId
        - paymentRecordId
        - orderStatus
        - paymentStatus

    StoreSettings:
      type: object
      description: Global storefront settings.
      properties:
        showVialImages:
          type: boolean
          description: When false, product vial/placeholder images are hidden across the storefront.
      required:
        - showVialImages
      additionalProperties: false

    PatchStoreSettingsRequest:
      type: object
      description: Update store settings. At least one field must be provided.
      properties:
        showVialImages:
          type: boolean
      additionalProperties: false

    OrderStatus:
      type: string
      enum: [pending, awaiting_payment, confirmed, failed, expired, refunded]

    AdminStats:
      type: object
      description: Server-derived operational counters for the admin dashboard.
      properties:
        pendingAccounts:
          type: integer
        ordersByStatus:
          type: object
          description: Count of orders per status. Every OrderStatus key is present (0 when none).
          additionalProperties:
            type: integer
        revenueCentsConfirmed:
          type: integer
          description: Sum of totalCents across confirmed orders. (fulfilled/shipped are not statuses in this schema, so only confirmed contributes.)
        outOfStockVariants:
          type: integer
        blockedSkus:
          type: integer
          description: Count of products with complianceStatus=blocked.
        totalProducts:
          type: integer
        totalAccounts:
          type: integer
      required:
